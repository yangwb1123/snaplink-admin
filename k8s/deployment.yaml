apiVersion: apps/v1
kind: Deployment
metadata:
  name: sso-console
  namespace: sv-sso
spec:
  replicas: 1
  selector:
    matchLabels: { app: sso-console }
  template:
    metadata:
      labels: { app: sso-console }
    spec:
      nodeSelector:
        kubernetes.io/hostname: u1-faex9
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sso-console
          image: snaplink/sso-console:v1
          imagePullPolicy: Never
          ports:
            - { containerPort: 80, name: http }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # nginx binds the privileged port 80 as the non-root UID above;
            # every other capability is still dropped.
            capabilities: { drop: [ALL], add: [NET_BIND_SERVICE] }
          volumeMounts:
            # nginx:alpine's entrypoint needs to create cache/pid dirs at
            # startup — readOnlyRootFilesystem above blocks writes anywhere
            # else on the root fs, so these two are the only writable paths.
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
      volumes:
        - { name: nginx-cache, emptyDir: {} }
        - { name: nginx-run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: sso-console
  namespace: sv-sso
spec:
  type: ClusterIP
  selector: { app: sso-console }
  ports:
    - { name: http, port: 80, targetPort: 80 }
