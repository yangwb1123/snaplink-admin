<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sso_admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>sso_admin</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // A release build may have registered Flutter's offline-first service
    // worker on this origin before the local dev proxy was started. That
    // worker can keep serving an old main.dart.js even after a rebuild, which
    // makes navigation fixes appear not to work. Local development must
    // always execute the files currently present in build/web.
    (async () => {
      const localDevelopment = new Set([
        'localhost',
        '127.0.0.1',
        '[::1]',
      ]).has(window.location.hostname);

      if (localDevelopment) {
        try {
          if ('serviceWorker' in navigator) {
            const registrations =
              await navigator.serviceWorker.getRegistrations();
            await Promise.all(
              registrations.map((registration) => registration.unregister()),
            );
          }
          if ('caches' in window) {
            const cacheNames = await caches.keys();
            await Promise.all(cacheNames.map((name) => caches.delete(name)));
          }
        } catch (error) {
          console.warn('Unable to reset local Flutter caches.', error);
        }
      }

      const bootstrap = document.createElement('script');
      bootstrap.async = true;
      bootstrap.src = localDevelopment
        ? `flutter_bootstrap.js?local-dev=${Date.now()}`
        : 'flutter_bootstrap.js';
      document.body.appendChild(bootstrap);
    })();
  </script>
</body>
</html>
