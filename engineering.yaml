# Declarative config for the checks/ engineering harness (cli.py + checks/).
#
# Adapted from snaplink's engineering.yaml for the sso-admin Flutter project.
# Edit values below to adjust thresholds for the Dart/Flutter ecosystem.

project:
  name: sso-admin
  language: dart

filesize:
  max_lines: 400
  ignore_patterns:
    - "_test.dart"
    - ".dart_tool/"
    - "build/"
    - "android/"
    - "ios/"
    - "linux/"
    - "macos/"
    - "windows/"
    - "web/"
  exemptions:
    # Complex screens that genuinely need more lines
    - "lib/main.dart"
    # i18n 数据表：翻译键值数据表（Map 字面量），拆分会破坏合并架构
    # （snaplink i18n catalog 按源文件合并生成），故登记豁免、不拆分。
    - "lib/i18n/app_strings.dart"
    - "lib/i18n/app_strings_source_admin_core.dart"
    - "lib/i18n/app_strings_source_admin_features.dart"
    - "lib/i18n/app_strings_source_portal.dart"
    # 2026-08 pages-ui refactor: componentized lists/status/empty states
    # pushed these pages just past the budget (1-38 lines over)
    - "lib/screens/admin/permissions_tab.dart"
    - "lib/screens/admin/device_security_widgets.dart"
    - "lib/screens/admin/distributed_cluster_panel.dart"
    - "lib/screens/admin/recovery_releases_tab.dart"
    # API client files (dense with docs and methods)
    - "lib/api/sso_client.dart"
    - "lib/api/snaplink_admin_types.dart"
    - "lib/api/portal_api.dart"
    - "lib/api/oidc_login_api.dart"
    - "lib/api/device_verify_api.dart"
    - "lib/api/setup_api.dart"
    # Legacy re-export forwarders (thin, will be removed)
    - "lib/sso_client.dart"
    - "lib/screens/admin/snaplink_admin_api.dart"
    - "lib/screens/admin/snaplink_admin_types.dart"
    - "lib/screens/portal/portal_api.dart"
    - "lib/screens/oidc_login/oidc_login_api.dart"
    - "lib/screens/device/device_verify_api.dart"
    - "lib/screens/setup/setup_api.dart"
    - "lib/screens/admin/clients_tab.dart"
    - "lib/screens/admin/audit_log_tab.dart"
    # Dashboard and complex tabs with detail route resolution
    - "lib/screens/admin/dashboard_screen.dart"
    - "lib/screens/admin/token_security_tab.dart"
    - "lib/screens/admin/governance_tab.dart"
    - "lib/screens/admin/admin_operations_tab.dart"
    # 2026-08 continuation: cohesive stateful screens remain intentionally
    # over the generic 400-line budget while their behavior-heavy sections
    # are being componentized. Keep these entries explicit (new files still
    # fail the budget) and track the next decomposition opportunities in
    # docs/TECH_DEBT.md rather than silently widening max_lines.
    - "lib/screens/admin/access_policies_tab.dart"
    - "lib/screens/admin/admin_live_events_tab.dart"
    - "lib/screens/admin/admin_overview_tab.dart"
    - "lib/screens/admin/break_glass_tab.dart"
    - "lib/screens/admin/client_detail_screen.dart"
    - "lib/screens/admin/commerce/commerce_tab.dart"
    - "lib/screens/admin/connections_tab.dart"
    - "lib/screens/admin/crypto_keys_tab.dart"
    - "lib/screens/admin/domains_tab.dart"
    - "lib/screens/admin/governance_widgets.dart"
    - "lib/screens/admin/local_users_tab.dart"
    - "lib/screens/admin/privacy_compliance_tab.dart"
    - "lib/screens/admin/scim/scim_resource_browser.dart"
    - "lib/screens/admin/tenant_branding_tab.dart"
    - "lib/screens/admin/tenant_detail_screen.dart"
    - "lib/screens/admin/tenants_tab.dart"
    - "lib/screens/admin/threat_policies_tab.dart"
    - "lib/screens/admin/usage_analytics_tab.dart"
    - "lib/screens/admin/user_support_cards.dart"
    - "lib/screens/admin/user_support_tab.dart"
    - "lib/screens/admin/users_tab.dart"
    - "lib/screens/admin/webhooks_tab.dart"
    - "lib/screens/developer/manage_panel.dart"
    - "lib/screens/oidc_login/account_flow_views.dart"
    - "lib/screens/oidc_login/oidc_login_view_flow.dart"
    - "lib/screens/portal/notifications_tab.dart"
    - "lib/screens/portal/organizations_tab.dart"
    - "lib/screens/setup/setup_widgets.dart"
  required_exemptions:
    - "lib/main.dart"

complexity:
  # Dart uses `dart analyze` with cyclomatic_complexity lint rule.
  # These thresholds are for the optional gocyclo/gocognit-style external check;
  # the primary enforcement is via analysis_options.yaml.
  max_cyclomatic: 12
  max_cognitive: 18
  ignore_pattern: "_test.dart|build/|.dart_tool/|gen/"
  exempt_functions:
    - build
    - _loginView
    - _mfaView
    - _consentView
    - _submitLogin
    - _handleSuccess
    - _buildApp
    - _buildLoginGate
    - _rolesCard
    - _assignmentsCard
    - _menusCard

architecture:
  # Forbidden imports by directory.
  # Each key is a lib/ subdirectory (relative to lib/).
  # Each value is a list of directories that key MUST NOT import.
  forbidden:
    # screens/ modules should be isolated from each other
    "screens/oidc_login": ["screens/admin", "screens/portal", "screens/developer", "screens/device", "screens/setup"]
    "screens/portal": ["screens/admin", "screens/developer", "screens/oidc_login"]
    "screens/admin": ["screens/portal", "screens/developer", "screens/oidc_login"]
    "screens/developer": ["screens/admin", "screens/portal"]
    "screens/device": ["screens/admin", "screens/portal"]
    "screens/setup": ["screens/admin", "screens/portal"]
    # Shared infrastructure layers cannot depend on screens
    "i18n": ["screens"]
    # Session and client are leaf modules
    "session.dart": ["screens", "i18n"]
  excluded_dirs:
    - .dart_tool
    - build
    - android
    - ios
    - linux
    - macos
    - windows
    - web
    - test
    - .git
    - .idea

directory_fanout:
  max_subdirs: 12
  exempt_dirs:
    - .dart_tool
    - .git
    - .idea
    - build
    - android
    - ios
    - linux
    - macos
    - windows
    - web
    - test
    - __pycache__
    - .pub-cache
    # docs/auto：pi-batch 运行时产物目录（每批一次 run-* 子目录），
    # 非源码目录，fan-out 不适用于运行时产物。
    - docs/auto

root_policy:
  max_files: 12
  allowed_files:
    - main.dart
    - pubspec.yaml
    - pubspec.lock
    - README.md
    - analysis_options.yaml
    - .gitignore
    - .metadata
    - engineering.yaml
    - cli.py
    - Dockerfile
    - nginx.conf
    - DEPLOY.md
  allowed_prefixes:
    - app_
  banned_patterns:
    - "*_tab.dart"
    - "*_screen.dart"
    - "*_api.dart"
    - "*_widgets.dart"
    - "*_dialog.dart"
    - "*_card.dart"
    - "*_client.dart"
    - "*_settings.dart"
  banned_files:
    - auth_handler.dart
    - main_handler.dart
    - router_handler.dart
  exempt_files:
    - main.dart
    - app_router.dart
    - app_settings.dart
    - session.dart
    - sso_client.dart  # re-export forwarder; migrated to lib/api/sso_client.dart

coverage:
  targets:
    ".": 15
    "lib": 20
    "lib/screens/oidc_login": 25
    "lib/screens/portal": 25

# B6-1b — debug-only ring copy surface gates (AC-1).
# Source gates executed on every landing via `python cli.py harness`
# (ci.yml "Engineering gates" step); the release-web artifact gate runs
# via `make release-artifact-check` right after `make build-prod`.
# Pin values are the post-seam set (design b6-1b storage-seam §1.7): the
# gate is red until the storage seam lands — the intended safe direction
# (W-1/W-2).
b6_1b_gates:
  service_file: lib/services/audit_log_service.dart
  tab_file: lib/screens/admin/audit_log_tab.dart
  catalog_dir: lib/i18n
  old_en_needles:
    - "Clear audit log?"
    - "local audit entries"
    - "'Clear log'"
  old_zh_needles:
    - "清空审计日志"
    - "本地审计记录"
    - "清除日志"
  new_keys:
    - "Clear local debug records?"
    - "This will permanently delete all {n} local debug records."
    - "Clear local debug records"
    - "Debug records: {n} entries"
    - "Debug records"
  # Post-seam pin values (design b6-1b storage-seam §1.7). The gate is
  # RED until the seam lands — the intended safe direction: it must not
  # be green independent of the seam (W-1/W-2).
  service_kdebug_count: 6
  tab_kdebug_count: 1
  initializer_pin: "_ringCopyEnabled = kDebugMode"
  storage_initializer_pin: "_storageEnabled = kDebugMode"
  guard_line: "if (!kDebugMode) return;"
  guard_line_count: 4
  # Mask ban (open finding 1): key-reconstruction constructs banned in
  # the service file — mirror of scan-6 R2.6, extended with the base64
  # family (an established idiom elsewhere in lib/, so scoped to the
  # file that owns the key literal).
  banned_service_tokens:
    - "String.fromCharCodes"
    - "base64Decode"
    - "base64Url"
  catalog_file: lib/i18n/app_strings_source_admin_core.dart
  # Recursive over build/web/ — a chunked build cannot silently widen
  # the artifact surface (open finding 2).
  artifact_dir: build/web
  artifact_en_needles:
    - "Clear audit log?"
    - "local audit entries"
    - "Clear log"
    - "sso_audit_log"
  # base64 / base64Url encodings of 'sso_audit_log': a masked write
  # (base64Decode('c3Nv...')) ships this text in the bundle even though
  # the source pins see no literal (open finding 1).
  artifact_key_masks:
    - "c3NvX2F1ZGl0X2xvZw=="
    - "c3NvX2F1ZGl0X2xvZw"
  artifact_zh_escaped:
    - "\\u6e05\\u7a7a\\u5ba1\\u8ba1"
    - "\\u672c\\u5730\\u5ba1\\u8ba1"
    - "\\u6e05\\u9664\\u65e5\\u5fd7"

build:
  output_dir: build/web
  base_href: /app/
  binaries:
    - name: sso-admin-web
      path: lib/main.dart

skills:
  dir: docs/skills
