# Minimal SPA config: this container always serves the bundle at "/" — an
# upstream gateway maps /admin/, /login/, /portal/, /developer/, /setup/, and
# /app/ (the asset prefix baked in via --base-href=/app/) to this root. Because
# every one of those 5 screens is chosen client-side by app_router.dart based
# on the URL the browser actually loaded (see resolveInitialScreen()), a
# direct browser hit/refresh on any deep path must still resolve to
# index.html rather than 404 — hence the try_files fallback.
server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
