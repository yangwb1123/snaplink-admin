# Rendered by the official nginx image from
# /etc/nginx/templates/default.conf.template. Every upstream must be an
# absolute HTTP(S) origin and owns its own TLS server name and trust anchor.
# Full deployments route commercial APIs to the independent Billing and
# payment-adapter services.
map $args $device_verify_check {
    default 0;
    ~(^|&)check(?:=|&|$) 1;
}

map "$request_method:$device_verify_check" $device_verify_api {
    default 1;
    "GET:0" 0;
}

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Flutter's production bundle uses /app/ as its base href. Strip that
    # public prefix while serving files from the build directory root.
    location ^~ /app/ {
        rewrite ^/app/(.*)$ /$1 break;
        try_files $uri $uri/ =404;
    }

    # RFC 8628 uses the same path for the browser screen and verification API.
    # A plain GET is the SPA; submissions and GET ?check=... belong upstream.
    location = /device/verify {
        error_page 418 = @snaplink_device_verify;
        if ($device_verify_api) { return 418; }
        try_files $uri $uri/ /index.html;
    }

    location @snaplink_device_verify {
        proxy_pass ${SNAPLINK_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name ${SNAPLINK_SERVER_NAME};
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate ${SNAPLINK_CA};
        proxy_buffering off;
    }

    # Billing remains an API-only service. Keep these paths ahead of the
    # generic Snaplink API matcher so the browser can use one trusted origin.
    location ~ ^/api/v1/(?:admin/commerce|commerce|metering)(?:/|$) {
        proxy_pass ${SNAPLINK_BILLING_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name ${SNAPLINK_BILLING_SERVER_NAME};
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate ${SNAPLINK_BILLING_CA};
        proxy_buffering off;
    }

    # Checkout is an exact, opt-in adapter route. Keep it ahead of the generic
    # /api matcher and preserve the browser's admin bearer; no provider secret
    # or card data is ever accepted by this proxy.
    location = /api/v1/checkout/sessions {
        proxy_pass ${SNAPLINK_STRIPE_ADAPTER_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name ${SNAPLINK_STRIPE_ADAPTER_SERVER_NAME};
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate ${SNAPLINK_STRIPE_ADAPTER_CA};
        proxy_buffering off;
    }

    # Same-origin Snaplink endpoints used by the six console experiences.
    location ~ ^/(?:auth/|api/|me(?:/|$)|\.well-known/|health(?:/|$)|token(?:/|$)|branding(?:/|$)|logout(?:/|$)|userinfo(?:/|$)|roles/|permissions/|menus/|sessions/|consents/|register(?:/|$)) {
        proxy_pass ${SNAPLINK_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name ${SNAPLINK_SERVER_NAME};
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate ${SNAPLINK_CA};
        proxy_buffering off;
    }

    # Six product routes and every deep link resolve client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
