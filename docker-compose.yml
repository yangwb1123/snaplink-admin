version: '3.8'

services:
  snaplink:
    image: snaplink/sso-server:latest
    ports:
      - "8080:8080"
    environment:
      SSO_CONFIG: /etc/sso-server/config.yaml
    volumes:
      - ./config.local.yaml:/etc/sso-server/config.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  console:
    build: .
    ports:
      - "4444:4444"
    depends_on:
      snaplink:
        condition: service_healthy
    environment:
      - SNAPLINK_URL=http://snaplink:8080
