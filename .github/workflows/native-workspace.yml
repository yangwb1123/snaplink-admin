name: Native workspace files

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/agent_workspace*'
      - 'android/**'
      - 'ios/**'
      - 'macos/**'
      - 'linux/**'
      - 'windows/**'
      - 'pubspec.*'
      - '.github/workflows/native-workspace.yml'
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'test/agent_workspace*'
      - 'android/**'
      - 'ios/**'
      - 'macos/**'
      - 'linux/**'
      - 'windows/**'
      - 'pubspec.*'
      - '.github/workflows/native-workspace.yml'

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev xvfb
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub test/agent_workspace_file_native_test.dart test/agent_workspace_native_widget_test.dart
      - run: flutter build ${{ matrix.target }} --debug --no-pub
      - if: runner.os == 'Linux'
        run: |
          cmake --build build/linux/x64/debug --target workspace_file_native_test
          timeout 60s xvfb-run -a build/linux/x64/debug/workspace_file_native_test
      - if: runner.os == 'Windows'
        name: Windows native file tests
        run: |
          cmake --build build/windows/x64 --config Debug --target workspace_file_native_test
          ctest --test-dir build/windows/x64 -C Debug --output-on-failure --timeout 60
      - if: runner.os == 'macOS'
        run: flutter build ios --debug --no-codesign --no-pub
      - if: runner.os == 'macOS'
        name: macOS native file tests
        run: >-
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner
          -configuration Debug -destination 'platform=macOS'
          test CODE_SIGNING_ALLOWED=NO
      - if: runner.os == 'macOS'
        name: iOS native file tests
        run: |
          flutter build ios --simulator --debug --no-pub
          workspace_simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); ids=[d["udid"] for runtime,devices in data["devices"].items() if ".iOS-" in runtime for d in devices if d.get("isAvailable") and d["name"].startswith("iPhone")]; sys.exit("No available iPhone simulator") if not ids else print(ids[0])')"
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -destination "platform=iOS Simulator,id=$workspace_simulator_id" -destination-timeout 120 test CODE_SIGNING_ALLOWED=NO

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --no-pub
      - run: ./gradlew :app:assembleDebugAndroidTest :app:testDebugUnitTest --console=plain
        working-directory: android
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android system document acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '36'
          system-image-api-level: '36.1'
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          emulator-port: 5554
          script: python3 android/tests/run_workspace_instrumentation.py --serial emulator-5554
