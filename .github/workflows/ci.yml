name: sso-console CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml
          flutter pub get

      - name: Analyze
        run: make analyze

      - name: Build
        run: make build

      - name: Engineering gates
        run: python3 cli.py harness

      - name: Unit tests
        run: make test

  integration:
    runs-on: ubuntu-latest
    needs: check
    services:
      snaplink:
        image: snaplink/sso-server:latest
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml requests

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:8080/health && break
            sleep 2
          done

      - name: Integration tests
        run: make integration
