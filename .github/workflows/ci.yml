name: sso-console CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          flutter pub get

      - name: Analyze
        run: make analyze

      - name: Build
        run: make build-prod

      - name: Release artifact check (B6-1b key-surface absence)
        run: make release-artifact-check

      - name: Engineering gates
        run: python3 cli.py harness

      - name: Kubernetes profile renders
        run: make k8s-render

      - name: Unit tests
        run: make test

      - name: Guard count pin (G7 B6-1 — 4-file suite must report exactly +82)
        run: make guard-count-pin

      - name: Browser tests
        run: make test-browser

  integration:
    runs-on: ubuntu-latest
    needs: check
    services:
      snaplink:
        image: snaplink/sso-server:latest
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:8080/health && break
            sleep 2
          done

      - name: Integration tests
        env:
          # Credentials belong only to the disposable CI fixture.
          SNAPLINK_TEST_USERNAME: admin
          SNAPLINK_TEST_PASSWORD: admin
        run: make integration
