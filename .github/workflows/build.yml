name: Build

# Every platform this project was scaffolded for
# (flutter create --platforms=web,linux,macos,windows,android,ios) gets its
# own build job below, on whichever runner OS can actually produce that
# platform's artifact. There is no signing/publishing pipeline yet, so every
# job just uploads its output as a workflow artifact for manual download.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Web + Linux desktop both build fine on a plain Ubuntu runner, so they
  # share a job. This is also where `flutter analyze` / `flutter test` run.
  web-and-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # lib/screens/oidc_login/oidc_login_screen.dart (and the portal screens)
      # import package:web/web.dart, which only compiles for a web
      # compilation target. The default `flutter test` VM platform doesn't
      # provide one, so those test files fail to even load unless the test
      # runner is pointed at an actual browser via --platform chrome.
      # ubuntu-latest ships Chrome preinstalled, so no extra setup is needed.
      - run: flutter test --platform chrome

      - run: flutter build web --release --base-href=/app/

      # Linux desktop build needs the GTK toolchain headers; not present on
      # the runner by default.
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - run: flutter build linux --release

      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: build/linux/x64/release/bundle
          if-no-files-found: error

  # Kept separate from web-and-linux so the Android SDK setup only runs when
  # it's actually needed.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 8.x (see android/settings.gradle.kts) requires JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # No release keystore is configured (or expected) for this project, so
      # `flutter build apk --release` falls back to the Flutter debug
      # signing key. That's fine for a CI build artifact meant for manual
      # install/testing, not store distribution.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  macos-and-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build macos --release

      # There's no Apple Developer signing certificate available in CI, so
      # --no-codesign is required for the build to succeed at all. The
      # resulting build/ios/iphoneos/Runner.app is unsigned and can't be
      # installed on a device as-is (it would need to be re-signed with a
      # real cert first) -- that is the expected, correct output of this
      # job, not a bug to fix later.
      - run: flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/macos/Build/Products/Release/*.app
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-unsigned
          path: build/ios/iphoneos/*.app
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release
          if-no-files-found: error
