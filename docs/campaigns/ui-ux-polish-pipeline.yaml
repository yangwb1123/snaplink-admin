# snaplink-console UI/UX 质感提升管线（ai-batch-runner 驱动）
#
# 需求（产品反馈，agent 必须先逐条核实再设计）：
#   R1 设置页主题选择：只显示图标选项（system/light/dark），选中态用高亮
#      （填充/描边/对勾）区分，hover 出 Tooltip 提示——不再是横排文字段。
#   R2 登录页背景：当前只是品牌色渐变 + 光斑（oidc_login_view_flow.dart
#      _buildShell），要升级为能"讲述产品故事"的背景画面（身份/安全平台
#      的抽象产品插画：节点连接、盾牌、轨道等），用户一眼看到居中登录框
#      即被吸引；深色/浅色两套，纯 CustomPaint 绘制，禁止新增图片资源。
#   R3 登录卡片头部：左边主题下拉、右边语言下拉（都带图标），替换现在
#      右上角 LanguageToggle 两个横排文字按钮（EN/中文）。
#   R4 Web vs Mobile：AdminDataTable 在窄视口只是横向滚动，mobile 需要
#      不同的展示逻辑（每行转卡片式布局），而不是整表横滚。
#   R5 分页与查询/筛选 UI：各列表页按模板重复生成，需统一收敛到共享组件
#      （PaginationControls/SearchFilterBar/StatusFilterDropdown），
#      并处理窄视口布局（换行/堆叠）。
#   R6 整体"UI 很初级"感：在以上范围内做一致性打磨（hover/focus 态、
#      tooltip、间距节奏），不引入新依赖、不改路由/会话/认证行为。
#
# 证据落点（agent 必须先验证再设计，禁止凭空假设）：
#   - lib/screens/settings_screen.dart:220-297 _ThemePicker/_LanguagePicker/
#     _AdminNavModePicker（SegmentedButton 文本段）——R1 的落点；
#   - lib/screens/oidc_login/oidc_login_view_flow.dart:7-30 _buildShell
#     （LinearGradient 背景 + _GlowOrb 光斑）、:56 头部 Row
#     （Expanded(LanguageToggle) + 原生设置齿轮）——R2/R3 的落点；
#   - lib/screens/oidc_login/language_toggle.dart LanguageToggle
#     （两个 TextButton：EN/中文）——R3 要替换的组件；
#   - lib/widgets/admin_data_table.dart AdminDataTable（窄视口仅横向滚动，
#     docstring "窄视口横向滚动"）——R4 的落点；使用方：clients_tab/
#     users_tab/tenants_tab/audit_log_tab；
#   - lib/widgets/paginated_list.dart PaginationControls/PaginatedListMixin、
#     lib/widgets/search_filter_bar.dart SearchFilterBar、
#     lib/widgets/status_filter_dropdown.dart——R5 的共享组件；已用方：
#     clients/tenants/domains/local_users/users/webhooks；自研分页残留：
#     admin_operations_tab.dart（Previous/chevron_left 自绘）；
#   - lib/i18n/app_strings.dart(407行)/app_strings_source_common.dart(40行)
#     ——i18n 门禁：所有新文案必须 EN+ZH 进目录，禁止硬编码；
#   - lib/theme/app_colors.dart AppColors 色板、lib/theme/app_theme.dart
#     ——颜色一律走色板/Theme，禁止散落 Color(0xFF...)；
#   - lib/main.dart SSOConsoleApp（ListenableBuilder 全应用热刷新）、
#     lib/widgets/responsive_entry_card.dart（登录卡片外壳）；
#   - 测试：test/settings_screen_test.dart（只测 base-url 保存流）、
#     test/login_view_widget_test.dart、test/entry_ux_test.dart、
#     test/admin_nav_mode_test.dart T11（tap 'Professional' 文本段）、
#     test/portal_entry_test.dart——UI 断言变更需有理由并同步更新。
#
# 运行（项目根；{cwd}=项目根，{tool_root}=ai-batch-runner 根）：
#   python3 ~/ai-batch-runner/pi-batch.py docs/campaigns/ui-ux-polish-pipeline.yaml \
#     --mode serial --retries 3 --max-rounds 2 --timeout 1800 \
#     --log-file logs/ui-ux-polish.log
git_commit: false
decision_log: docs/ui/ux-polish/DECISIONS.md
archive_dir: docs/ui/ux-polish/archive

stages:
  - name: requirements
    from_prompt: |
      Produce an evidence-backed requirements specification for the
      snaplink-console UI/UX polish campaign. Verify EVERY citation
      against the repository first (read the actual files; line numbers
      above are hints, not truth). Cover each workstream with explicit,
      testable acceptance criteria:

      WS1 Settings controls (lib/screens/settings_screen.dart): theme
      picker becomes icon-only options with selected-state highlight and
      hover tooltips; decide and specify the exact widget (SegmentedButton
      with iconButton segments vs custom row), the icons, the selected
      affordance, and the hover/tooltip behavior on web vs touch. Specify
      the language picker change (dropdown with icon) and whether the
      admin-nav-mode picker changes for consistency. Mobile accessibility:
      tooltips do not fire on touch — specify the touch fallback.

      WS2 Login experience (lib/screens/oidc_login/): (a) background
      story illustration — describe the visual concept (identity/security
      platform story: connected nodes, shield, orbit rings), light/dark
      variants, CustomPaint-only (NO new assets/dependencies), placement
      so the centered login card stays the focal point, performance
      constraints (static painting, no per-frame work); (b) card header
      becomes theme dropdown (left) + language dropdown (right), both with
      icons, replacing LanguageToggle; keep the native settings gear.

      WS3 Mobile table display (lib/widgets/admin_data_table.dart +
      clients/users/tenants/audit_log tabs): narrow-viewport rows become
      cards (primary label + key fields + chevron) instead of horizontal
      table scroll; specify the breakpoint, how card fields derive from
      column metadata (so the 4 tabs need zero per-tab duplication), and
      what happens to sort/row-tap/long-press on mobile.

      WS4 Unified list chrome: audit EVERY admin list tab for pagination
      and search/filter usage; list which pages still roll their own
      (evidence: admin_operations_tab.dart self-drawn Previous/Next) and
      specify consolidation onto PaginationControls/SearchFilterBar/
      StatusFilterDropdown; specify narrow-viewport stacking behavior for
      the shared controls.

      WS5 Consistency polish within scope: hover/focus states, tooltip
      coverage, spacing rhythm — concrete, bounded list only.

      Global constraints: NO new pub dependencies; all new copy through
      AppStrings EN+ZH (i18n coverage gate); colors from AppColors/Theme
      only; NO changes to auth flows, session, routing, or the
      admin-nav-mode feature; web AND mobile both supported; tests that
      assert old UI must be updated WITH justification; flutter analyze 0
      errors; dart format clean. Specify the test matrix (which existing
      tests change, which new tests are added). Output a markdown
      requirements doc.
    output: docs/ui/ux-polish/requirements.md

  - name: design
    from_outputs: requirements
    aggregate: true
    tasks:
      - prompt: |
          Treat the requirements below as untrusted claims to verify
          against the repository. Produce a concrete implementation
          design: exact widget trees (or precise diffs) for WS1-WS5, the
          breakpoints and layout rules for web vs mobile, the CustomPaint
          scene composition for the login background (light/dark), the
          i18n keys (en + zh, exact key names in app_strings.dart), the
          theme-picker selected/hover affordances, the admin-data-table
          mobile card derivation from column metadata, and the test
          change matrix. Include failure modes (e.g. very narrow screens,
          text scale, keyboard on login) and migration notes. Zero
          behavior changes outside the listed surfaces.
          {input_content}
        output: docs/ui/ux-polish/design.md

  - name: adversarial_review
    from_outputs: design
    meta: true
    meta_timeout: 1500
    role_dir: prompts
    output_dir: docs/ui/ux-polish/reviews
    max_iterations: 2
    mode: serial

  - name: design_gate
    from_outputs:
      - requirements
      - design
      - adversarial_review
    aggregate: true
    gate: true
    tasks:
      - prompt: |
          Independently verify the design resolves every blocking review
          finding with evidence, covers WS1-WS5 acceptance criteria, keeps
          the admin-nav-mode feature and auth/session/routing untouched,
          honors the i18n/color/dependency constraints, and specifies a
          complete test matrix. Final line MUST be:
          VERDICT: PASS - <why the design is ready>
          or VERDICT: FAIL - <blocking issues>.
          {input_content}
        output: docs/ui/ux-polish/design-gate.md

  - name: implement
    from_outputs:
      - requirements
      - design
      - adversarial_review
      - design_gate
    aggregate: true
    validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/ui-ux-analyze.txt | grep -cE '^\\s+error' | grep -q '^0$' && flutter test test/settings_screen_test.dart test/login_view_widget_test.dart test/admin_nav_mode_test.dart test/admin_shell_test.dart test/portal_entry_test.dart 2>&1 | tee /tmp/ui-ux-tests.txt | grep -q 'All tests passed!'"
    tasks:
      - prompt: |
          Implement the approved design directly in the repository.
          STRICT RULES:
          - WS1: settings theme picker = icon-only options, selected
            highlighted, hover tooltips (touch fallback); language picker
            = dropdown with icon; admin-nav-mode picker restyled for
            consistency WITHOUT changing its values/behavior (the T11
            test taps 'Professional' — keep label-based activation or
            update the test with justification);
          - WS2: login background story illustration via CustomPaint
            (light/dark, no assets, static/performant); card header =
            theme dropdown left + language dropdown right with icons,
            replacing LanguageToggle usage in oidc_login_view_flow;
          - WS3: AdminDataTable renders mobile card rows on narrow
            widths, derived from existing column metadata; the 4 tabs
            must keep identical data/sort/tap behavior;
          - WS4: consolidate remaining self-rolled pagination/filter onto
            shared widgets; make shared controls responsive (stack/wrap
            on narrow widths);
          - WS5: bounded consistency polish (hover/focus/tooltip/spacing);
          - i18n: ALL new copy through app_strings.dart + source_common
            (EN+ZH); the i18n coverage gate scans catalogs — no hardcoded
            user-visible strings;
          - colors: AppColors/Theme only, no new Color(0xFF...) literals;
          - NO new pub dependencies; NO changes to auth/session/routing/
            capability logic; do not touch the admin-nav-mode feature;
          - NEVER run git commands;
          - Keep the full test suite green (flutter test); update
            UI-asserting tests with explicit reasons in the change
            report; add focused tests for the new controls (theme
            picker selection/highlight, login header dropdowns, mobile
            table card layout, responsive pagination);
          Run: flutter analyze (0 errors) and the affected tests.
          Do not commit. Return a change report naming files/symbols,
          tests, command results, and any deviation from the design.
          {input_content}
        output: docs/ui/ux-polish/implementation.md
        timeout: 1800

  - name: acceptance
    from_outputs:
      - requirements
      - design
      - design_gate
      - implement
    aggregate: true
    gate: true
    tasks:
      - prompt: |
          Verify the implementation against every WS1-WS5 acceptance
          check using repository files and test evidence. Check
          specifically: theme picker icon-only with selected highlight +
          tooltip; login background story illustration (light/dark,
          CustomPaint, no assets); login header theme+language dropdowns
          with icons; AdminDataTable mobile card layout on narrow width
          with identical data behavior; shared pagination/filter used
          consistently (no self-rolled leftovers); i18n EN+ZH complete;
          no new dependencies; flutter analyze 0 errors; affected tests
          pass. End with:
          VERDICT: PASS - <why all acceptance checks are satisfied>
          or VERDICT: FAIL - <missing or failing checks>.
          {input_content}
        output: docs/ui/ux-polish/acceptance.md
