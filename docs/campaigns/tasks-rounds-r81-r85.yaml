  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test test/admin_secondary_tabs2_test.dart test/admin_governance_security_test.dart test/admin_workflows_test.dart test/render_matrix_smoke_test.dart"

