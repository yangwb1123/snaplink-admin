  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test test/token_policies_tab_test.dart test/token_exchange_tab_test.dart test/admin_secondary_tabs2_test.dart test/render_matrix_smoke_test.dart"

