  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test test/portal_screens_test.dart test/device_bulk_revoke_dialog_test.dart test/session_list_rows_test.dart test/portal_security_contract_test.dart test/portal_entry_test.dart test/render_matrix_smoke_test.dart"

