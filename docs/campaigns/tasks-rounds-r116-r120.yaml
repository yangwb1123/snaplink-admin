# R116-R120：Portal/OIDC/设备详情/共享 chrome + 终检
# 规则：只改白名单内现有文件；禁止新 Dart 文件、part 拆分、大重构和 git。
# 认证、Session、MFA、Consent、设备码、Checkout 和 API 语义保持不变。
#
# 运行：python3 ~/ai-batch-runner/pi-batch.py docs/campaigns/tasks-rounds-r116-r120.yaml --mode serial --timeout 900

tasks:
- prompt: |
    R116：/portal/security account credential 与 factor 子卡。
    阅读 security_account_credentials.dart、security_change_email_card.dart、
    security_change_password_card.dart、passkey_enrollment_card.dart、recovery_codes_card.dart、
    trusted_devices_card.dart。密码/email/passkey/recovery/trusted device 均用分组 form/card/list；
    检查 loading/error/success、按钮防重入、确认、精确输入、一次性恢复码/secret 显示、copy/
    clear、窄屏字段与键盘。不要将高风险 account action 变成无确认 row action。

    只允许修改 security_account_credentials.dart、passkey_enrollment_card.dart 的低风险 UI；
    其余子卡只审查。禁止新文件、PortalApi/Session/MFA/passkey/recovery 语义变化、新依赖和
    git；portal 源码不得新增英文字样 audit。运行 flutter analyze；测试
    test/portal_screens_test.dart test/portal_security_widgets_test.dart
    test/portal_security_contract_test.dart test/portal_security_web_test.dart
    test/portal_entry_test.dart test/render_matrix_smoke_test.dart。输出
    docs/ui/pages-per-page/r116-portal-security-account.md。
  output: docs/ui/pages-per-page/r116-portal-security-account.md
  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test test/portal_screens_test.dart test/portal_security_widgets_test.dart test/portal_security_contract_test.dart test/portal_security_web_test.dart test/portal_entry_test.dart test/render_matrix_smoke_test.dart"

