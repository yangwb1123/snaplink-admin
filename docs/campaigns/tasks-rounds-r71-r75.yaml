    connections_tab.dart、domains_tab.dart，禁止触碰 connections/ 子目录和其他文件。
    逐页判断 provider/domain 数据 table vs card/list；检查类型/状态/健康字段优先级、
    搜索/筛选/排序/分页、刷新、空态/错误重试、详情/创建/删除操作和窄屏长域名布局。
    secret 脱敏、URL 校验和能力门控保持不变。

    只允许上述两个文件；禁止新文件、part 拆分、大重构、API/路由/安全语义变化、
    新依赖、git。复用现有 AdminDataTable、SearchFilterBar、PaginatedList、StatusChip、
    EmptyState；文件 ≤400 行要求用最小修复处理。

    运行 flutter analyze；测试 test/connection_details_redaction_test.dart
    test/domains_tab_test.dart test/admin_detail_screens_test.dart
    test/admin_secondary_tabs_test.dart test/render_matrix_smoke_test.dart。输出
    docs/ui/pages-per-page/r75-admin-connections-domains.md。
  output: docs/ui/pages-per-page/r75-admin-connections-domains.md
  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test test/connection_details_redaction_test.dart test/domains_tab_test.dart test/admin_detail_screens_test.dart test/admin_secondary_tabs_test.dart test/render_matrix_smoke_test.dart"
