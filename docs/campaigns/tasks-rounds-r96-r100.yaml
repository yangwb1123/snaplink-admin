    长值是否在窄屏可读；注册结果、一次性 client secret、registration token、manage/update/
    delete 操作是否使用明确 card、复制/隐藏/清除和确认；loading/error/retry、焦点、autofill、
    键盘提交和 320/400px 布局。不得显示一次性凭据超过协议允许生命周期。

    只允许修改 register_panel.dart、dcr_metadata_form.dart 的低风险 UI；manage_panel 已接近
    预算只审查。禁止新文件、DCR/API/secret/registration token 语义变化、新依赖和 git；
    developer 源码不要新增英文字样 audit。运行 flutter analyze；测试
    test/dcr_models_test.dart test/dcr_widgets_test.dart test/developer_api_test.dart
    test/developer_forge_invisibility_test.dart test/developer_ring_isolation_test.dart
    test/developer_serving_region_test.dart test/render_matrix_smoke_test.dart。输出
    docs/ui/pages-per-page/r99-developer-dcr.md。
  output: docs/ui/pages-per-page/r99-developer-dcr.md
  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test test/dcr_models_test.dart test/dcr_widgets_test.dart test/developer_api_test.dart test/developer_forge_invisibility_test.dart test/developer_ring_isolation_test.dart test/developer_serving_region_test.dart test/render_matrix_smoke_test.dart"

- prompt: |
    R100：共享列表/分页/筛选与全站终检。不要大规模重构；只修复已发现的低风险
    UI 问题，且只能修改 paginated_list.dart、search_filter_bar.dart；若无明确问题则只产出报告。
    阅读 AdminDataTable 及其 card/header/table-cell 子组件作为上下文，逐项检查：
    <640px table→card、分页首末/空页、Load more 防重入、搜索 debounce/controller dispose、
    筛选清除回第一页、键盘/a11y、触控目标、lazy build、320/400/640/768/桌面布局。
    对照 R91-R99 产物检查所有 admin/portal/developer/settings/device/setup/login 路由。

    禁止新文件、API/Session/安全/Checkout/能力门控语义变化、新依赖和 git；portal、developer、
    oidc_login 源码不得新增英文字样 audit。运行 flutter analyze；仅执行轻量门禁并输出
    docs/ui/pages-per-page/r100-final-audit-10.md，报告覆盖矩阵、table/list/card 决策、
    分页筛选矩阵、结构预算和残留，不在本任务内运行全量 build。最后一行严格为
    VERDICT: PASS - ... 或 VERDICT: FAIL - ...。
  output: docs/ui/pages-per-page/r100-final-audit-10.md
  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings && python3 cli.py harness"
