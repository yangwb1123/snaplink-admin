# 逐页 UI 重构 — batch 2b（security 组：network-policies/access-policies/threat-policies/dr-mode/crypto-keys/credentials/break-glass/change-approvals）
#
# 每页一个任务：先分析该页现有代码，再实施重构，最后跑 analyze + 该页
# 相关测试。串行执行（--mode serial），每页完成后 operator 验证并提交，
# 再推进下一页（"逐个一步一步"）。
#
# 运行（项目根）：
#   python3 ~/ai-batch-runner/pi-batch.py docs/campaigns/tasks-pages-security-2b.yaml \
#     --mode serial --timeout 1500 --log-file logs/pages-security-2b.log
# 参考：docs/ui/admin-pages/audit.md（全站审计）、
#       docs/ui/pages/fix-security.md（上一轮批量修复记录）

tasks:
- prompt: |
    重构网络策略页面。步骤：
    1. 分析现有代码：lib/screens/admin/network_policies_tab.dart、
       network_policy_dialog.dart —— 读完整文件，梳理策略列表/分类/CRUD
       的 UI 结构。
    2. 对照可用组件（lib/widgets/）与组色（adminModuleIconColor
       ('network-policies')），结合 docs/ui/admin-pages/audit.md 中
       network-policies 条目，列出改进点。
    3. 实施重构（只改上述文件 + lib/i18n/ EN/ZH key）：
       - 用合适组件替换模板渲染；图标按组色上色；
       - loading/empty/error 三态齐全；策略语义保持不变；
       - 不新增依赖；文件 ≤400 行。
    4. 验证：flutter analyze 0 errors；flutter test
       test/admin_secondary_tabs2_test.dart 全绿。
    5. 输出 docs/ui/pages-per-page/network-policies.md（分析摘要→问题
       清单→修复映射→验证结果）。不跑 git、不提交。
  output: docs/ui/pages-per-page/network-policies.md
  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep -cE '^\\s+error' | grep -q '^0$' && flutter test test/admin_secondary_tabs2_test.dart 2>&1 | grep -qE 'All tests passed!'"

