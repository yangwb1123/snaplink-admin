    空页/加载更多/失败重试、撤销操作与反馈、移动端筛选/分页器可达性。敏感字段、
    撤销确认、API/能力语义保持不变。

    只允许一个现有文件；禁止新文件、part 拆分、大重构、新依赖和 git。复用已有
    AdminDataTable、SearchFilterBar、PaginatedList、EmptyState、StatusChip；低风险
    UI 修复即可，已有行数超限不通过拆分解决。

    运行 flutter analyze；测试 test/token_security_tab_test.dart
    test/token_refresh_test.dart test/admin_secondary_tabs2_test.dart
    test/render_matrix_smoke_test.dart。输出 docs/ui/pages-per-page/r76-admin-token-security.md。
