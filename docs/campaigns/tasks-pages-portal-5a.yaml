  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep -cE '^\\s+error' | grep -q '^0$' && flutter test test/portal_screens_test.dart test/portal_security_widgets_test.dart 2>&1 | grep -qE 'All tests passed!'"

