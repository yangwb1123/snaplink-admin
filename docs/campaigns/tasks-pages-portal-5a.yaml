       详情/改名/备注/报失/删除的 UI 结构。
    2. 对照可用组件与组色（adminModuleIconColor 不可用于 portal——
       用 colorScheme 品牌色），结合审计 portal 条目，列出改进点。
    3. 实施重构（只改上述文件 + lib/i18n/ EN/ZH key）：
       - 用合适组件替换模板渲染；图标上色；
       - loading/empty/error 三态齐全；设备操作语义（报失/删除确认、
         活动/会话/信任展示）保持不变；不新增依赖；文件 ≤400 行。
    4. 验证：flutter analyze 0 errors；flutter test
       test/portal_screens_test.dart test/portal_security_widgets_test.dart
       全绿。
    5. 输出 docs/ui/pages-per-page/portal-devices.md。不跑 git、不提交。
