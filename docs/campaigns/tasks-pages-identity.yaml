# 逐页 UI 重构 — batch 1（identity 组：clients/users/local-users/scim/permissions/authz-checks）
#
# 每页一个任务：先分析该页现有代码，再实施重构，最后跑 analyze + 该页
# 相关测试。串行执行（--mode serial），每页完成后 operator 验证并提交，
# 再推进下一页（"逐个一步一步"）。
#
# 运行（项目根）：
#   python3 ~/ai-batch-runner/pi-batch.py docs/campaigns/tasks-pages-identity.yaml \
#     --mode serial --timeout 1500 --log-file logs/pages-identity.log
# 参考：docs/ui/admin-pages/audit.md（全站审计，含本组逐页发现）、
#       docs/ui/pages/fix-identity.md（上一轮批量修复记录，避免重复劳动）

tasks:
- prompt: |
    重构客户端页面。步骤：
    1. 分析现有代码：lib/screens/admin/clients_tab.dart、
       client_detail_screen.dart、client_detail_secret_card.dart、
       client_form_dialog.dart、client_secret_lifecycle.dart —— 读完整
       文件，梳理列表/详情/表单的结构、状态管理与渲染方式。
    2. 对照可用组件（lib/widgets/：admin_data_table、status_chip、
       empty_state、skeleton_list、search_filter_bar、paginated_list、
       batch_action_bar、section_header、async_view、error_boundary、
       key_metric_card 等）与组色（adminModuleIconColor('clients')），
       结合 docs/ui/admin-pages/audit.md 中 clients 条目，列出本页可
       改进点：模板化渲染、缺失状态、单色图标、硬编码颜色/文案。
    3. 实施重构（只改上述 5 个文件 + lib/i18n/ EN/ZH key）：
       - 用合适组件替换模板渲染（不强行套用）；
       - 图标按组色上色；loading/empty/error 三态齐全；
       - 保持 API 契约、能力门控、路由、i18n、现有测试语义；
       - 不新增依赖；文件 ≤400 行。
    4. 验证：flutter analyze 0 errors；flutter test
       test/admin_workflows_test.dart test/admin_secondary_tabs_test.dart
       test/admin_dialogs_final_test.dart 全绿。
    5. 输出 docs/ui/pages-per-page/clients.md：分析摘要（现状结构）→
       问题清单（severity+证据+建议组件）→ 修复映射（问题→改动）→
       验证结果（命令输出）。不跑 git、不提交。
  output: docs/ui/pages-per-page/clients.md
  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep -cE '^\\s+error' | grep -q '^0$' && flutter test test/admin_workflows_test.dart test/admin_secondary_tabs_test.dart test/admin_dialogs_final_test.dart 2>&1 | grep -qE 'All tests passed!'"

