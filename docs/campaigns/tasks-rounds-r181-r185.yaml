    `Dockerfile`、`k8s/base/deployment.yaml`、`k8s/minimal/console-profile.yaml`、
    `k8s/full/kustomization.yaml`、`nginx.conf`、`Makefile`、`tests/unit/test_deployment_contracts.py`、
    `tests/unit/test_robust_proxy.py`、`tests/unit/test_integration_config.py`、
    `tests/integration/test_config.py` 与最近 R175/R180 报告。

    验证非 root UID/securityContext、read-only root filesystem、`/run` nginx writable
    volume、`/etc/nginx/conf.d`/`/var/cache/nginx` mounts、探针、audit-gov upstream、
