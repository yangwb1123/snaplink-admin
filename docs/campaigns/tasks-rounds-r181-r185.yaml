# R181-R185：Audit/部署安全契约冻结后的持续回归与最终门禁
# 目标：在 R176-R180 后验证 audit read、debug ring、部署 non-root、路径 owner 与结构预算无漂移。
# 只在发现本批直接引入的明确回归时做最小修复，不猜测后端契约。
# 运行：python3 ~/ai-batch-runner/pi-batch.py docs/campaigns/tasks-rounds-r181-r185.yaml --mode serial --no-git-commit --timeout 900 --dry-run
#      python3 ~/ai-batch-runner/pi-batch.py docs/campaigns/tasks-rounds-r181-r185.yaml --mode serial --no-git-commit --timeout 900

tasks:
- prompt: |
    R181：Audit read contract 冻结审计（默认只读）。完整读取当前 `git status`、`git diff`、
    `lib/api/audit_read_client.dart`、`lib/api/audit_query.dart`、`lib/api/audit_event_row.dart`、
    `lib/api/snaplink_admin_api.dart`、`lib/screens/admin/audit_log_tab.dart`、
    `test/audit_read_client_test.dart`、`test/audit_query_test.dart`、`test/audit_event_row_test.dart`、
    `test/audit_log_tab_test.dart`、`test/audit_contract_guard_test.dart` 以及 R156-R180 相关报告。

    逐项核对：(a) audit trio 的既有 path literals 仍单一归属，event id 仅单次
    `Uri.encodeComponent`；(b) `AuditQuery` 默认 wire 仍精确为 `{'limit': '100'}`，
    tenant_id/trace_id 仅在调用方显式提供且非空时转发，cursor/event_type/outcome 的
    现有 key 与过滤语义不被猜测修改；(c) `AuditEventRow` 仍是 redact-first、allowlist、
    never-throws 的 server shape mapper；(d) AuditLogTab 只渲染服务端读取结果，能力门控、
    loading/error/empty、导出与 Session/认证行为不变；(e) 没有把 BFF 注入的 tenant_id/trace_id
    来源臆造到 console。只输出 `docs/ui/pages-per-page/r181-audit-read-contract-freeze.md`，
    不修改 lib、test、API、路由或安全语义。
  output: docs/ui/pages-per-page/r181-audit-read-contract-freeze.md
  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test test/audit_read_client_test.dart test/audit_query_test.dart test/audit_event_row_test.dart test/audit_contract_guard_test.dart test/audit_log_tab_test.dart && git diff --check"

- prompt: |
