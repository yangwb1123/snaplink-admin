    `lib/services/audit_log_service.dart`、`lib/api/snaplink_admin_api.dart`、
    `lib/screens/admin/audit_log_tab.dart`、所有 `test/*audit*`、
    `test/developer_forge_invisibility_test.dart`、`test/oidc_login_ring_isolation_test.dart`、
    `checks/b6_1b_gates.py`、`Makefile`、`engineering.yaml` 与 R175/R180 最终报告。

    核对 `_storageKey = 'sso_audit_log'` 仍只在 service owner，`kDebugMode` guards、
    `_storageEnabled` seam、release DCE、ring copy surface、server-truth rendering、
    forged local ring 不可见和 GET 不写 ring 等不变量；核对 release artifact needles/masks
    与当前部署构建一致。不得因已有 heuristic 或未来 BFF/backend 提案修改 production。
    只有本批直接引入的明确安全回归才做最小修复，否则只输出
    `docs/ui/pages-per-page/r182-audit-ring-release-boundary.md`，并明确区分 in-repo proof
    与 `[PROPOSED]` 后端语义。
  output: docs/ui/pages-per-page/r182-audit-ring-release-boundary.md
  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test test/audit_log_service_test.dart test/audit_log_tab_test.dart test/audit_contract_guard_test.dart test/developer_forge_invisibility_test.dart test/oidc_login_ring_isolation_test.dart && python3 checks/b6_1b_gates.py && git diff --check"

- prompt: |
