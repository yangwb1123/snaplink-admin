    回退成 `/var/run`，不修改 API、路由、认证、Session、MFA、Consent、Checkout、secret、
    导出或审计后端语义。输出 `docs/ui/pages-per-page/r183-deployment-contract-review.md`。
  output: docs/ui/pages-per-page/r183-deployment-contract-review.md
  validate: "cd {cwd} && python3 -m unittest tests.unit.test_deployment_contracts tests.unit.test_robust_proxy tests.unit.test_integration_config && python3 checks/filesize.py && git diff --check"

