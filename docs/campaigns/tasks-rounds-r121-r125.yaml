# 允许新增与页面同目录的 Dart view/section 文件，仅用于搬移现有 UI；禁止新依赖、API/路由/状态语义变化和 git。
# 每个 Dart 文件必须 <=400 行；若无法安全拆分则只报告，不强行追加。
#
# 运行：python3 ~/ai-batch-runner/pi-batch.py docs/campaigns/tasks-rounds-r121-r125.yaml --mode serial --timeout 900

tasks:
- prompt: |
    R121：拆分 lib/screens/admin/clients_tab.dart（当前约 906 行）。这是预算优先的纯结构
    重构，不新增功能。保留 ClientsTab、_ClientsTabState、字段、分页/筛选/排序、批量动作、
    secret rotation、AdminRoute 和 SSOAdminClient 调用完全不变。

    将现有 rendering 方法通过 part 拆到两个新文件：
    - clients_tab_view.dart：build、_menu、_filterBar、_listBody、_batchBar；
    - clients_tab_sections.dart：_mobileList、_clientActions、_dataTable。
    在 root 添加 part 声明，删除被搬移的原方法，利用 Dart part 共享私有成员；不要复制
    state/逻辑。root 和两个新文件都必须 <=400 行，文件名和 part 关系清晰。
    保留 AdminDataTable 的桌面 table/<640px card、分页、筛选回第一页、空态、a11y 和
    i18n；禁止改变 API、筛选 query、CSV、确认、批量或 secret 生命周期。

    只允许修改 clients_tab.dart 并新增 clients_tab_view.dart、clients_tab_sections.dart；
    不改其他文件，不跑 git。运行 dart format（仅这些文件）、flutter analyze；测试
    test/admin_workflows_test.dart test/admin_shell_test.dart test/admin_secondary_tabs_test.dart
    test/client_id_contract_test.dart test/client_secret_lifecycle_api_test.dart
    test/admin_data_table_cards_test.dart test/render_matrix_smoke_test.dart。输出
    docs/ui/pages-per-page/r121-admin-clients-budget-split.md。
  output: docs/ui/pages-per-page/r121-admin-clients-budget-split.md
  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test test/admin_workflows_test.dart test/admin_shell_test.dart test/admin_secondary_tabs_test.dart test/client_id_contract_test.dart test/client_secret_lifecycle_api_test.dart test/admin_data_table_cards_test.dart test/render_matrix_smoke_test.dart"

