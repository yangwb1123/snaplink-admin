# 10 轮推进（第七轮）— R61-R65（命令面板 / 错误边界 / 导出复制 / 图表组件 / 品牌一致性）
#
# 串行执行（--mode serial），失败即停由 operator 接管。
#
# 运行（项目根）：
#   python3 ~/ai-batch-runner/pi-batch.py docs/campaigns/tasks-rounds-r61-r65.yaml \
#     --mode serial --timeout 1500 --log-file logs/rounds-r61-r65.log

tasks:
- prompt: |
    轮次 R61：命令面板与快捷键。步骤：
    1. 分析 lib/widgets/command_palette.dart、command_palette_commands.dart、
       shortcuts_dialog.dart 与使用点：
       a. 命令覆盖：命令面板的命令是否覆盖主要页面跳转/操作（模块
          导航、设置、刷新、新建等）——缺失清单；
       b. 快捷键：shortcuts_dialog 展示的快捷键与 command_palette 实际
          注册的一致性；
       c. 触发：Ctrl/Cmd+K 等全局触发的注册范围（admin 壳层）；
       d. 语义：命令面板条目图标/颜色（组色）。
    2. 修复低风险项（白名单 lib/ + lib/i18n/）：
       - 缺失命令补齐（保持命令语义）；
       - 快捷键一致性；
       - 保持行为与既有测试；不新增依赖；文件 ≤400 行；
       - 禁止 'audit' 字样进入 portal/developer/oidc_login。
    3. 验证：flutter analyze 0 errors；flutter test
       test/command_palette_commands_test.dart（如存在）
       test/admin_shell_test.dart test/render_matrix_smoke_test.dart 全绿。
    4. 输出 docs/ui/pages-per-page/r61-command-palette.md。不跑 git、
       不提交。
  output: docs/ui/pages-per-page/r61-command-palette.md
  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep -cE '^\\s+error' | grep -q '^0$' && flutter test test/admin_shell_test.dart test/render_matrix_smoke_test.dart 2>&1 | grep -qE 'All tests passed!'"

- prompt: |
    轮次 R62：错误边界覆盖。步骤：
    1. 分析 lib/widgets/error_boundary.dart 与使用范围：
       a. 覆盖：页面级 ErrorBoundary 包裹范围（dashboard 壳层有，
          详情页/对话框/Portal 页面是否缺）；
       b. 降级：边界内崩溃的降级 UI（错误提示 + 重载）一致性；
       c. 日志：边界捕获错误的上报（debugPrint）；
       d. 粒度：过粗（整页）vs 过细（每个组件）的平衡。
    2. 修复低风险项（白名单 lib/ + lib/i18n/）：
       - 缺失边界的关键页面/详情补 ErrorBoundary（保持行为）；
       - 降级 UI 统一；
       - 保持行为与既有测试；不新增依赖；文件 ≤400 行；
       - 禁止 'audit' 字样进入 portal/developer/oidc_login。
    3. 验证：flutter analyze 0 errors；flutter test
       test/error_boundary_test.dart（如存在）test/admin_shell_test.dart
       test/portal_screens_test.dart test/render_matrix_smoke_test.dart 全绿。
    4. 输出 docs/ui/pages-per-page/r62-error-boundaries.md。不跑 git、
       不提交。
  output: docs/ui/pages-per-page/r62-error-boundaries.md
  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep -cE '^\\s+error' | grep -q '^0$' && flutter test test/error_boundary_test.dart test/admin_shell_test.dart test/portal_screens_test.dart test/render_matrix_smoke_test.dart 2>&1 | grep -qE 'All tests passed!'"

