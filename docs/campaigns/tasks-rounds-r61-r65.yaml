       b. 复制反馈：CopyableCell 复制后的反馈（SnackBar/图标变化）
          一致性；
       c. 敏感数据：凭据/密钥复制的确认与一次性展示；
       d. 大导出：导出中状态与失败重试。
    2. 修复低风险项（白名单 lib/ + lib/i18n/）：
       - 复制反馈统一；
       - 导出状态补齐；
       - 保持行为与既有测试；不新增依赖；文件 ≤400 行；
