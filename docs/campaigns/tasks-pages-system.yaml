# 逐页 UI 重构 — batch 4a（system+overview 组：governance/audit-log/user-support/overview/health/live-activity/operations）
#
# 每页一个任务：先分析该页现有代码，再实施重构，最后跑 analyze + 该页
# 相关测试。串行执行（--mode serial）。
#
# 运行（项目根）：
#   python3 ~/ai-batch-runner/pi-batch.py docs/campaigns/tasks-pages-system.yaml \
#     --mode serial --timeout 1500 --log-file logs/pages-system.log
# 参考：docs/ui/admin-pages/audit.md、docs/ui/pages/fix-system.md

tasks:
- prompt: |
    重构治理页面。步骤：
    1. 分析现有代码：lib/screens/admin/governance_tab.dart、
       governance_widgets.dart、governance_models.dart —— 读完整文件，
       梳理配置差异/历史/集群差异/健康/实时事件的 UI 结构。
    2. 对照可用组件（lib/widgets/）与组色（adminModuleIconColor
       ('governance')），结合 docs/ui/admin-pages/audit.md 中 governance
       条目，列出改进点。
    3. 实施重构（只改上述文件 + lib/i18n/ EN/ZH key）：
       - 用合适组件替换模板渲染；图标按组色上色；
       - loading/empty/error 三态齐全；审计查询/筛选语义保持不变；
       - 不新增依赖；文件 ≤400 行。
    4. 验证：flutter analyze 0 errors；flutter test
       test/admin_governance_security_test.dart test/admin_secondary_tabs_test.dart
       全绿。
    5. 输出 docs/ui/pages-per-page/governance.md（分析摘要→问题清单→
       修复映射→验证结果）。不跑 git、不提交。
  output: docs/ui/pages-per-page/governance.md
  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep -cE '^\\s+error' | grep -q '^0$' && flutter test test/admin_governance_security_test.dart test/admin_secondary_tabs_test.dart 2>&1 | grep -qE 'All tests passed!'"

