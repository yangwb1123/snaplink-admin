# 不改变 API wire、后端路由、能力门控、认证、Session、MFA、Consent、Checkout、secret、导出或 SSE。
# 运行：python3 ~/ai-batch-runner/pi-batch.py docs/campaigns/tasks-rounds-r201-r205.yaml --mode serial --no-git-commit --timeout 900 --dry-run
#      python3 ~/ai-batch-runner/pi-batch.py docs/campaigns/tasks-rounds-r201-r205.yaml --mode serial --no-git-commit --timeout 900

tasks:
- prompt: |
    R201：AdminDataTable 窄屏卡片复制 affordance 的触控/a11y 最小修复。读取
    `lib/widgets/admin_data_table.dart`、`lib/widgets/admin_data_table/card_mode.dart`、
    `lib/widgets/admin_data_table/table_cells.dart`、`test/admin_data_table_cards_test.dart`、
    `test/admin_data_table_density_test.dart` 和相关 R41/R51/R58 报告。重点核对
    `_copyableCardCell` 的复制 `IconButton` 当前显式 `minWidth/minHeight: 28` 是否低于
    Flutter 平台最小交互尺寸（48），以及它在行级 Semantics、整卡 tap/long-press、
    `CopyableCell.copy`、comfortable/compact density 下是否仍独立可达。若实测为低于
    48，只增大 hit target（保留 icon 14px、视觉 padding/density、文本布局、复制反馈和
    行级语义），并在 `test/admin_data_table_cards_test.dart` 增加回归断言：窄屏
    CopyableCell 的 copy control 实际尺寸两个轴均 >= `kMinInteractiveDimension`，仍有
    copy tooltip/独立 semantics；不要改变 API 或数据 wire。若证据显示已满足，则只报告
    不修改代码。输出 `docs/ui/pages-per-page/r201-table-card-copy-target.md`。
  output: docs/ui/pages-per-page/r201-table-card-copy-target.md
  validate: "cd {cwd} && dart format --output=none --set-exit-if-changed lib/widgets/admin_data_table/card_mode.dart test/admin_data_table_cards_test.dart && flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test test/admin_data_table_cards_test.dart test/admin_data_table_density_test.dart && git diff --check"

- prompt: |
