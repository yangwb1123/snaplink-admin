    当前 diff、`lib/widgets/admin_data_table.dart`、`lib/widgets/admin_data_table/card_mode.dart`、
    `lib/widgets/admin_data_table/header_cell.dart`、`lib/widgets/empty_state.dart`、
    `lib/widgets/async_view.dart`、`lib/widgets/skeleton_list.dart`、`lib/widgets/search_filter_bar.dart`、
    `test/admin_data_table_cards_test.dart`、`test/admin_data_table_density_test.dart`、
    `test/empty_state_variants_test.dart`、`test/list_chrome_test.dart`。

    核对：<640px 关系数据仍 card、>=640px table、unbounded horizontal host 仍 table；
    row/list semantics 不重复朗读且 checkbox/copy/action 独立可达；排序/筛选/clear/retry
    不重复请求；loading/empty/no-match/not-enabled/error 文案经 i18n 且 reduced-motion
    不崩；comfortable/compact 只影响间距，不缩小交互 hit target。不要为 heuristic warning
    机械拆分、不要改变 endpoint、query、路由、认证或状态机。输出
    `docs/ui/pages-per-page/r202-shared-data-view-semantics.md`。
  output: docs/ui/pages-per-page/r202-shared-data-view-semantics.md
  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test test/admin_data_table_cards_test.dart test/admin_data_table_density_test.dart test/empty_state_variants_test.dart test/list_chrome_test.dart test/shared_widgets_test.dart test/responsive_navigation_scaffold_test.dart && git diff --check"

