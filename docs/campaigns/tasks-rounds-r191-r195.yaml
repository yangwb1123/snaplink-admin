    `/home/u1/workspace/demo/snaplink/docs/openapi.yaml`，只读）。当前 FEATURE_COVERAGE
    声称“管理、审计、合规、网络策略及 SCIM 目录共 197 个”——必须从当前 `routes` 原文
    逐项计算，不凭印象替换数字；按该句明确的 scope 统计 `/api/v1/admin/`、`/api/v1/audit/`、
    `/api/v1/compliance/`、`/api/v1/netpolicy/`、`/api/v1/scim/`，不要把 scope 外的
