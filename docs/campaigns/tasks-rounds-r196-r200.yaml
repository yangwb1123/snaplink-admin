# R196-R200：本地代理文档可执行性与最终契约复核
# 目标：修正 R192 后发现的 DEPLOY.md shell 示例换行不可直接复制执行问题，并守住代理配置边界。
# 不改变 API wire、后端路由、认证、Session、MFA、Consent、Checkout、secret、导出或 SSE 语义。
# 运行：python3 ~/ai-batch-runner/pi-batch.py docs/campaigns/tasks-rounds-r196-r200.yaml --mode serial --no-git-commit --timeout 900 --dry-run
#      python3 ~/ai-batch-runner/pi-batch.py docs/campaigns/tasks-rounds-r196-r200.yaml --mode serial --no-git-commit --timeout 900

tasks:
- prompt: |
    R196：本地代理 shell 示例可执行性修复。读取 `DEPLOY.md`、`README.md`、`Makefile`、
    `dev.sh`、`tools/robust_proxy.py`、`tests/unit/test_integration_config.py`、
    `tests/unit/test_documentation_contracts.py` 与 R192 报告。检查所有新增/改动的本地
    proxy 命令是否能作为 POSIX shell 复制执行：R192 的 DEPLOY.md 示例在同一个 inline
    code span 内换行但没有反斜杠，复制后会把 `SNAPLINK_API_URL=...` 等环境赋值拆成
    无命令的 shell 行，实际只给最后一行设置变量。用最小文档修复（优先 fenced
    `bash` block 或单行命令）使 `SNAPLINK_API_URL`、`SNAPLINK_PROXY_PORT`、
    `SNAPLINK_STRIPE_ADAPTER_URL`、`AUDIT_GOVERNANCE_UPSTREAM` 和
    `python3 tools/robust_proxy.py` 处于同一个可复制命令；保留占位符必须替换、
    Audit Governance upstream 必须显式配置、缺失时 fail closed 的说明。不要写入任何
    真实地址/凭据，不修改代理逻辑或 API。可在 `tests/unit/test_documentation_contracts.py`
    增加一个不脆弱的文档命令断言，保护关键变量同命令出现。输出
    `docs/ui/pages-per-page/r196-local-proxy-command-usability.md`。
  output: docs/ui/pages-per-page/r196-local-proxy-command-usability.md
  validate: "cd {cwd} && python3 -m unittest tests.unit.test_documentation_contracts tests.unit.test_integration_config tests.unit.test_robust_proxy && git diff --check"

- prompt: |
    R197：README/DEPLOY 本地开发入口与环境边界回归（默认只读）。读取 R196 报告、当前
    diff、`README.md`、`DEPLOY.md`、`Makefile`、`dev.sh`、`tests/integration/test_config.py`、
    `tests/unit/test_integration_config.py` 和 `tools/robust_proxy.py`。

    逐项证明：make/dev shell 会继承调用者显式设置的 `AUDIT_GOVERNANCE_UPSTREAM`；
    integration subprocess 的环境复制不会丢失它；README 与 DEPLOY 不提供未经证明的
    audit 默认地址、不保存凭据、不暗示 core fallback；Stripe/Checkout 仍是独立
    upstream；API、认证和静态 SPA fallback 说明没有被文档命令误导。若 R196 直接引入
    文档/测试回归才做最小修复，否则不改代码。输出
    `docs/ui/pages-per-page/r197-local-proxy-boundary-regression.md`。
  output: docs/ui/pages-per-page/r197-local-proxy-boundary-regression.md
  validate: "cd {cwd} && python3 -m unittest tests.unit.test_documentation_contracts tests.unit.test_integration_config tests.unit.test_robust_proxy tests.unit.test_deployment_contracts && git diff --check"

- prompt: |
    R198：文档契约与 API/route/security owner 复核（默认只读）。读取 R196-R197 报告、
    `tests/unit/test_documentation_contracts.py`、`docs/FEATURE_COVERAGE.md`、
    `docs/PRODUCT_ARCHITECTURE.md`、`docs/TECH_DEBT.md`、`lib/api/snaplink_admin_types.dart`、
    `lib/api/audit_read_client.dart`、`lib/api/audit_query.dart`、`lib/api/admin_paths.dart`、
    `lib/screens/portal/portal_security_contract.dart`、`lib/app_router.dart`、
    `test/audit_contract_guard_test.dart`、`test/portal_security_contract_test.dart`。

    证明 docs route count guard 只观察既有 `routes` block，不生成/开放 endpoint；scope
    count 214 与全量 catalog 215 的解释一致；local proxy compatibility rewrite
    不泄漏到 Dart owner；tenant_id/trace_id 仍是可选显式输入，Portal/Admin ownership、
    segment-aware matching、单次编码、固定 `client_id`、debug ring release boundary
    和 SSE 生命周期不变。无明确回归则只输出
    `docs/ui/pages-per-page/r198-documentation-security-boundary-review.md`，不得为降低
    计数修改生产协议或安全状态机。
  output: docs/ui/pages-per-page/r198-documentation-security-boundary-review.md
  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test test/audit_contract_guard_test.dart test/audit_read_client_test.dart test/audit_query_test.dart test/portal_security_contract_test.dart test/app_router_client_id_wiring_test.dart && python3 -m unittest tests.unit.test_documentation_contracts tests.unit.test_robust_proxy && git diff --check"

- prompt: |
    R199：结构/i18n/docs fan-out 台账复核。读取 R196-R198 报告、`docs/TECH_DEBT.md`、
    `engineering.yaml`、`lib/screens`、`lib/i18n`、`lib/api/sso_client.dart`、
    `lib/api/admin_paths.dart`、Developer census 测试、i18n 测试和 `docs/ui` 目录清单。

    只同步有实测证据的当前数字：`lib/screens` 248 文件且全部 <=400、Developer 13、
    route catalog 215/scoped 214、source/ZH 2313/2313、identity pattern 0、
    appAdditionalStrings 105/105、docs/ui 顶层 <=12、pages-per-page 平铺数量（本轮
    R196-R199 报告也计入）。保留 non-root `/run`、专用 AUDIT_GOVERNANCE_UPSTREAM、
    BFF tenant_id/trace_id `[PROPOSED]` 与 heuristic 非阻塞说明。仅更新
    `docs/TECH_DEBT.md` 中确实过期的轮次/报告数；不修改 API、路由、阈值或 Dart。输出
    `docs/ui/pages-per-page/r199-ledger-reconciliation.md`。
  output: docs/ui/pages-per-page/r199-ledger-reconciliation.md
  validate: "cd {cwd} && python3 checks/filesize.py && python3 checks/directory_fanout.py && python3 -m unittest discover -s tests/unit -p 'test_*.py' && git diff --check"

- prompt: |
    R200：最终门禁。读取 R196-R199 报告和全部当前 diff；确认只保留可复制的本地 proxy
    文档、必要文档回归断言、必要 TECH_DEBT 对账、campaign YAML，不引入真实凭据或
    无证据 endpoint。`web/flutter_bootstrap.js` 必须保持预先存在且未跟踪。

    运行并记录：受影响 Dart/Python format 检查（不扩散既有 catalog baseline formatting）、
    `flutter analyze --no-fatal-infos --no-fatal-warnings`、全量 `flutter test`、Chrome smoke
    `flutter test --platform chrome test/widget_test.dart test/portal_security_web_test.dart test/federated_login_web_test.dart`、
    `make build-prod`、`make release-artifact-check`、`python3 -m unittest discover -s tests/unit -p 'test_*.py'`、
    `python3 cli.py harness`、`python3 checks/filesize.py`、`python3 checks/directory_fanout.py`、
    `git diff --check`。输出 `docs/ui/pages-per-page/r200-final-audit-26.md`，最后一行必须严格
    匹配 `VERDICT: PASS - ...` 或 `VERDICT: FAIL - ...`；只有全部门禁通过才能写 PASS。
  output: docs/ui/pages-per-page/r200-final-audit-26.md
  validate: "cd {cwd} && python3 checks/filesize.py && python3 checks/directory_fanout.py && flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test && flutter test --platform chrome test/widget_test.dart test/portal_security_web_test.dart test/federated_login_web_test.dart && make build-prod && make release-artifact-check && python3 -m unittest discover -s tests/unit -p 'test_*.py' && python3 cli.py harness && git diff --check && tail -1 docs/ui/pages-per-page/r200-final-audit-26.md | grep -Eq '^VERDICT: (PASS|FAIL) - .+$'"
