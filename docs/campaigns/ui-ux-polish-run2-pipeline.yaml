# snaplink-console UI/UX 质感提升 — run 2（权威设计落地）
#
# run 1 结论：requirements/design 由 agent 产出但被 runner 的 summary-writer
# 覆盖（仅最终消息落盘）；design_gate 按轮次裁决。本 run 使用人工整合的
# 权威文档（docs/ui/ux-polish/requirements.md + design.md，已吸收两轮评审
# 全部整改项），直接进入 设计门禁 → 实现（带验证闭环）→ 验收门禁。
#
# 运行（项目根；{cwd}=项目根，{tool_root}=ai-batch-runner 根）：
#   python3 ~/ai-batch-runner/pi-batch.py docs/campaigns/ui-ux-polish-run2-pipeline.yaml \
#     --mode serial --retries 3 --max-rounds 2 --timeout 1800 \
#     --log-file logs/ui-ux-polish-run2.log
git_commit: false
decision_log: docs/ui/ux-polish/DECISIONS.md
archive_dir: docs/ui/ux-polish/archive

stages:
  - name: design_gate
    from_prompt: |
      Independently verify docs/ui/ux-polish/design.md (rev-3, authoritative)
      against the repository and the review findings in
      docs/ui/ux-polish/reviews/ (a11y_reviewer.md, accessibility-audit.md,
      i18n_audit_rev2.md, i18n_reviewer.md, flutter_perf_reviewer.md,
      l10n_reviewer.md, test_plan_reviewer.md) and the previous gate
      verdict docs/ui/ux-polish/design-gate.md. Check specifically:
      1. WS1 theme picker: no wrapper Focus, InkWell(onFocusChange:), no
         Semantics(label:), TooltipTriggerMode hover/never, caption
         maxLines 2, selected affordance, language dropdown with icon,
         nav-mode picker untouched (T11 taps 'Professional');
      2. WS2 login backdrop: RepaintBoundary/IgnorePointer/ExcludeSemantics,
         CustomPaint-only, brightness-only shouldRepaint, no blur/assets/
         ticker; header theme-left/language-right dropdowns in Flexible;
         LanguageToggle removal safe (no other references);
      3. WS3 AdminDataTable card mode <640, metadata-derived fields,
         gesture/sort/scrollable parity, onSort==null + unbounded-width
         guards;
      4. WS4 SearchFilterBar debounce/labelText/controller/onSubmitted,
         audit debounce:false (AC-1.6/F5 pins), PaginationControls
         page-null guard + summaryLabel + Wrap<560, ScimPager→
         PaginationControls with en-dash parity, AdminListHeader wrap,
         PaginatedListMixin adoption;
      5. i18n exactly 2 new keys with correct zh values and catalogs;
      6. test matrix: 13 preservation contracts hold, 5 new files + 1
         extension cover every gate-flagged assertion (SCIM zh summary
         '第 1–25 条，共 100 条', WS5#1 findsOneWidget, WS5#3 zh tooltip,
         WS5#4 wrap, WS1 focus/triggerMode, WS3 guards);
      7. constraints: no new deps/assets, no auth/session/routing/capability
         changes, colors via AppColors/Theme.
      Final line MUST be:
      VERDICT: PASS - <why the design is ready>
      or VERDICT: FAIL - <blocking issues>.
    output: docs/ui/ux-polish/design-gate-run2.md
    gate: true

  - name: implement
    from_prompt: |
      Implement docs/ui/ux-polish/design.md (rev-3) in the repository.
      The design is authoritative; verify each anchor before editing.
      STRICT RULES:
      - WS1: icon-only theme picker (brightness_auto/light_mode/dark_mode,
        primaryContainer fill + primary 2px border + check_circle badge,
        InkWell(onFocusChange:) focus border, Tooltip hover-only on web,
        caption maxLines 2, Semantics(selected:) only); language picker =
        dropdown with icon; nav-mode picker UNCHANGED; delete the
        duplicate description Text in _SettingsCard;
      - WS2: new lib/screens/oidc_login/login_backdrop.dart (CustomPaint
        scene: orbit rings + shield + node clusters + dashed ring, light/
        dark AppColors palettes, RepaintBoundary > IgnorePointer >
        ExcludeSemantics > CustomPaint, brightness-only shouldRepaint,
        NO blur/ImageFilter/BackdropFilter/Ticker/Timer/assets/deps,
        central exclusion band); login header = theme dropdown (left) +
        language dropdown (right) with icons inside Flexible, gear kept
        for !kIsWeb; remove LanguageToggle if unreferenced elsewhere;
      - WS3: AdminDataTable card mode below 640px parent width, fields
        derived from AdminDataColumn metadata (cardPrimary/cardDetail
        opt-in with auto-derivation), same InkWell/checkbox/popup/sort/
        scrollable behavior, onSort==null guard, unbounded-width fallback
        to table mode;
      - WS4: SearchFilterBar gains debounce/labelText/controller/
        onSubmitted (backward compatible); audit_log_tab uses
        debounce:false; call-site copy via .localized/context.tr ONLY
        (i18n gate scans labelText:/hintText: literals); PaginationControls
        page int? + page-null guard + summaryLabel/summaryArgs + Wrap<560;
        ScimPager -> PaginationControls (summary '{start}–{end} of {total}'
        with U+2013 en-dash, page: null); AdminListHeader Wrap<560;
        PaginatedListMixin in clients_tab;
      - i18n: add EXACTLY 2 keys to app_strings_source_admin_core.dart:
        'Click to copy' -> '点击复制', '{start}–{end} of {total}' ->
        '第 {start}–{end} 条，共 {total} 条'; wire admin_data_table.dart
        Tooltip message through context.tr;
      - WS5: delete duplicate @override at login_view_widget.dart:58/60;
      - NO new dependencies, NO new assets, NO changes to auth/session/
        routing/capability logic/nav-mode feature; colors via AppColors/
        Theme only;
      - Format every file you touch with: dart format <file>
      - Add the 5 new test files + app_strings_test extension exactly as
        specified in design.md §7.2 (incl. the zh PaginationControls
        summary assertion '第 1–25 条，共 100 条' and the WS1 keyboard-
        focus test via Tab traversal, not tap).
      - NEVER run git commands.
      Run: flutter analyze (0 errors) and flutter test on the affected
      suites (test/admin_nav_mode_test.dart test/admin_shell_test.dart
      test/settings_screen_test.dart test/login_view_widget_test.dart
      test/portal_entry_test.dart test/entry_ux_test.dart plus the new
      files). Do not commit. Return a change report naming files/symbols,
      tests, command results, and any deviation from the design.
    output: docs/ui/ux-polish/implementation.md
    timeout: 1800
    validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/ui-ux-r2-analyze.txt | grep -cE '^\\s+error' | grep -q '^0$' && flutter test test/theme_picker_test.dart test/login_backdrop_test.dart test/admin_data_table_cards_test.dart test/list_chrome_test.dart test/consistency_polish_test.dart test/admin_nav_mode_test.dart test/admin_shell_test.dart test/settings_screen_test.dart test/login_view_widget_test.dart test/portal_entry_test.dart 2>&1 | tee /tmp/ui-ux-r2-tests.txt | grep -q 'All tests passed!'"

  - name: acceptance
    from_prompt: |
      Verify the implementation against the design (docs/ui/ux-polish/
      design.md) and requirements (docs/ui/ux-polish/requirements.md)
      using repository files and test evidence. Check specifically:
      theme picker icon-only + selected highlight + hover tooltip +
      single-tab-stop keyboard focus; login backdrop story illustration
      (CustomPaint, light/dark, ExcludeSemantics, no assets); login header
      theme+language dropdowns with icons (Flexible, no overflow);
      AdminDataTable card mode <640 with behavior parity; ScimPager
      consolidated onto PaginationControls with the en-dash summary and
      zh translation; audit search synchronous (debounce:false); exactly 2
      new i18n keys; no new dependencies/assets; WS5 fixes (duplicate
      description/@override/'Click to copy'); flutter analyze 0 errors;
      the new tests plus the preservation contracts pass (run
      flutter test on the affected files). End with:
      VERDICT: PASS - <why all acceptance checks are satisfied>
      or VERDICT: FAIL - <missing or failing checks>.
    output: docs/ui/ux-polish/acceptance-run2.md
    gate: true
