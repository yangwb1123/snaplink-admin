# R166-R170：Admin wire-path ownership and prefix-classifier follow-up
# 目标：集中已有 Admin wire literals，修正同一批次发现的 prefix classification；不改 API 语义。
# 运行：python3 ~/ai-batch-runner/pi-batch.py docs/campaigns/tasks-rounds-r166-r170.yaml --mode serial --no-git-commit --timeout 900

tasks:
- prompt: |
    R166：做一次 Admin wire-path ownership audit，先不修改源码。完整读取当前
    `git status`、R161-R165 报告、`lib/api/sso_client*.dart`、
    `lib/api/snaplink_admin_*.dart`、`lib/screens/admin/**/*.dart` 中的 API path
    literal，以及 `test/api_paths_test.dart`、Admin contract tests、
    `/home/u1/workspace/demo/snaplink/docs/openapi.yaml` 对应段落。

    建立一份精确的重复路径清单：区分 (a) 已有 owner（例如
    `DeviceSecurityPaths`、`AuditReadClient`、SCIM model），(b) 可安全集中到新的
    `lib/api/admin_paths.dart` 的既有 Admin wire paths，(c) 必须保留局部模板/协议
    catalog 的 literal。只选择已在多个生产 consumer 中重复、且可由纯替换证明 wire
    等价的路径；不要为了数字减少而重写 `routes` catalog、测试 fixture、Portal
    API、OpenAPI 或每个局部 screen 的独有 endpoint。

    特别检查 `AdminOpsHelpers.requiresDedicatedWorkflow`、
    `AdminOperationsTab._adminEndpoints` 等仍直接 `startsWith` 的 Admin path
    classifier：记录是否会把 `snapshots-evil`、`auditx` 等 sibling 混入；提出
    与 R161 `SnaplinkAdminCapabilities.matchesPathPrefix` 对齐的最小修复方案。
    确认参数模板（`:id`/`{id}`）、custom verb、Uri.encodeComponent、method
    exact-match、runtime/documented merge、能力三态、认证/Session/安全流程都不能
    改变。输出 `docs/ui/pages-per-page/r166-admin-path-ownership-audit.md`，报告
    必须给出建议 owner、迁移 consumer 和明确不迁移的边界。
  output: docs/ui/pages-per-page/r166-admin-path-ownership-audit.md
  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings && python3 checks/filesize.py && python3 checks/directory_fanout.py && git diff --check"

- prompt: |
    R167：根据 R166 审计实施最小 Admin path owner。读取报告、当前 diff 和全部
    相关文件；仅新增同目录可复用的 `lib/api/admin_paths.dart`（或报告证明更合适
    的同层 owner），并把选定的、已重复的既有 Admin wire literals 替换为常量/编码
    builder。至少覆盖 R166 证明重复且不含 Portal 的 collection/detail families；
    可以覆盖 endpoint inventory 和 admin event stream，但不得把 generated
    `routes` catalog 或 `/home/u1/workspace/demo/snaplink/docs/openapi.yaml` 改成
    第二份可执行 spec。

    所有 dynamic id/hostname/email/type 必须继续先 `Uri.encodeComponent`；模板路径
    继续使用 `:id`/`{id}` 仅用于 capability/catalog matching，不得把模板直接当
    wire path 发送。保留现有 query 拼接、content type、cache key、error、audit
    record、retry、onUnauthorized 和 response parsing。禁止修改 `lib/api/portal_api.dart`
    及 Portal re-export shim，禁止新增依赖、endpoint、route、能力或 i18n 文案。

    迁移 `sso_client`/admin API 与 screen consumer 时优先引用 owner，不复制状态/API；
    如某个路径具有独有协议语义则保留其既有局部常量并在报告中说明。为 owner
    builder 增加最小纯 Dart/Flutter contract tests，覆盖固定 wire 值和含空格、斜杠、
    加号的 opaque identifier 编码。运行 dart format、analyze、受影响 API/Admin
    tests、filesize、diff check。输出 `docs/ui/pages-per-page/r167-admin-path-owner.md`。
  output: docs/ui/pages-per-page/r167-admin-path-owner.md
  validate: "cd {cwd} && dart format --output=none --set-exit-if-changed $(git diff --name-only -- '*.dart' | grep -v '^lib/screens/admin/domains_tab.dart$') lib/api/admin_paths.dart test/admin_paths_test.dart test/admin_operations_selector_test.dart && flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test test/api_paths_test.dart test/sso_client_test.dart test/snaplink_admin_api_test.dart test/admin_navigation_test.dart test/admin_contract_consistency_test.dart test/admin_detail_screens_test.dart && python3 checks/filesize.py && git diff --check"

- prompt: |
