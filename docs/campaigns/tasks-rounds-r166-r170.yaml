  validate: "cd {cwd} && dart format --output=none --set-exit-if-changed $(git diff --name-only -- '*.dart' | grep -v '^lib/screens/admin/domains_tab.dart$') lib/api/admin_paths.dart test/admin_paths_test.dart test/admin_operations_selector_test.dart && flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test test/admin_operations_selector_test.dart test/admin_navigation_test.dart test/admin_contract_consistency_test.dart test/api_paths_test.dart test/sso_client_test.dart test/snaplink_admin_api_test.dart test/admin_secondary_tabs_test.dart test/admin_health_breakglass_test.dart test/sensitive_data_test.dart && python3 checks/filesize.py && python3 checks/directory_fanout.py && git diff --check"

