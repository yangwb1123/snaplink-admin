    slash prefix 不要无谓改写。

    只替换既有 wire literals 为 R167 owner 常量/builder，不改页面结构、API 方法、
    body/query、能力 gate 或服务端契约。新增/调整最小回归测试：owner builder wire
    equivalence、operations selector 不混入 lookalike、dedicated-workflow 不误分类
    sibling、合法 snapshot/release/break-glass/change descendants 仍被保护。若
    R167 已覆盖 classifier，保持源码不变并只补缺失断言。不得修改 Portal API/shim、
    catalog routes、OpenAPI、认证、Session、MFA、Consent、Checkout、SSE reconnect
    或 audit storage gate。输出 `docs/ui/pages-per-page/r168-admin-path-consumers.md`。
