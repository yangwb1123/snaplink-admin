    对 R166 已确认的 Admin family classifier（尤其
    `AdminOpsHelpers.requiresDedicatedWorkflow` 与 `AdminOperationsTab` 的 endpoint
    family filter）复用 `SnaplinkAdminCapabilities.matchesPathPrefix` 或等价的
    segment-aware helper；保留 trailing slash subtree、合法 descendants、参数段
