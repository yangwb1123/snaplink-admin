# 逐页 UI 重构 — batch 3（tenants 组：tenants/organizations/commerce/usage-analytics/privacy-compliance）
#
# 每页一个任务：先分析该页现有代码，再实施重构，最后跑 analyze + 该页
# 相关测试。串行执行（--mode serial）。
#
# 运行（项目根）：
#   python3 ~/ai-batch-runner/pi-batch.py docs/campaigns/tasks-pages-tenants.yaml \
#     --mode serial --timeout 1500 --log-file logs/pages-tenants.log
# 参考：docs/ui/admin-pages/audit.md、docs/ui/pages/fix-tenants.md

tasks:
- prompt: |
    重构租户页面。步骤：
    1. 分析现有代码：lib/screens/admin/tenants_tab.dart、tenant_detail_screen.dart、
       tenant_detail_tabs.dart、tenant_form_dialog.dart、tenant_export_download.dart、
       tenant_lifecycle_copy.dart —— 读完整文件，梳理租户列表/详情/表单/
       导出/生命周期操作的 UI 结构。
    2. 对照可用组件（lib/widgets/）与组色（adminModuleIconColor
       ('tenants')），结合 docs/ui/admin-pages/audit.md 中 tenants 条目，
       列出改进点。
    3. 实施重构（只改上述文件 + lib/i18n/ EN/ZH key）：
       - 用合适组件替换模板渲染；图标按组色上色；
       - loading/empty/error 三态齐全；租户语义（suspend/delete 撤销
         报告、数据驻留、导出下载）保持不变；不新增依赖；文件 ≤400 行。
    4. 验证：flutter analyze 0 errors；flutter test
       test/admin_secondary_tabs_test.dart test/admin_detail_screens_test.dart
       test/admin_dialogs_final_test.dart 全绿。
    5. 输出 docs/ui/pages-per-page/tenants.md（分析摘要→问题清单→修复
       映射→验证结果）。不跑 git、不提交。
  output: docs/ui/pages-per-page/tenants.md
  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep -cE '^\\s+error' | grep -q '^0$' && flutter test test/admin_secondary_tabs_test.dart test/admin_detail_screens_test.dart test/admin_dialogs_final_test.dart 2>&1 | grep -qE 'All tests passed!'"

