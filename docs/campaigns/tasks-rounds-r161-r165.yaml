# R161-R165：Admin capability path-boundary hardening
# 只修正已有 capability/catalog prefix 的 segment boundary；不新增 endpoint 或能力。
# 运行：python3 ~/ai-batch-runner/pi-batch.py docs/campaigns/tasks-rounds-r161-r165.yaml --mode serial --no-git-commit --timeout 900

tasks:
- prompt: |
    R161：修复 Admin capability prefix 的边界匹配。完整读取
    lib/api/snaplink_admin_types.dart、lib/api/snaplink_admin_catalog.dart、
    lib/screens/admin/admin_navigation.dart 及相关 tests。当前
    SnaplinkAdminCapabilities.hasAnyPathPrefix、
    SnaplinkAdminOperationCatalog.hasDocumentedPathPrefix 和
    AdminNavigationCapabilities._hasAnyPathPrefix 直接使用 startsWith；这会把
    `/api/v1/admin/domains-x`、`/api/v1/admin/devices-evil` 等非同一路径段误判为
    `/domains`、`/devices` 能力。

    将 prefix 语义收敛为 segment-aware：prefix 以 `/` 结尾时保留现有 subtree
    语义；否则只接受 exact path、prefix + `/` 子路径，以及已有 OpenAPI custom-verb
    形式在参数段后的 `:verb`（若当前实现/调用确实需要）。保留现有 `{id}`/`:id`
    normalization、大小写、method exact-match、documented/runtime merge 和
    catalog fallback 语义。AdminNavigationCapabilities 应复用修正后的
    SnaplinkAdminCapabilities 行为，避免三套边界规则继续漂移；保留其
    `_normalizedPath` 仅用于 merge key（若仍被需要）。

    不修改 routes 字符串、OpenAPI、screen/API 请求、能力名称、认证、Session、
    401/403 或服务器裁决；不新增依赖。增加最小单元回归：exact、合法子路径、
    parameter/custom verb、lookalike sibling（如 `domains-x`/`devices-evil`）分别
    断言；catalog helper 同样覆盖正反例。优先修改 test/snaplink_admin_api_test.dart
    或已有 admin contract test，不复制大段生产 route 表。运行 dart format、
    flutter analyze、test/snaplink_admin_api_test.dart test/admin_navigation_test.dart
    test/admin_contract_consistency_test.dart 及 python3 checks/filesize.py、
    git diff --check。输出 docs/ui/pages-per-page/r161-capability-path-boundary.md。
  output: docs/ui/pages-per-page/r161-capability-path-boundary.md
  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test test/snaplink_admin_api_test.dart test/admin_navigation_test.dart test/admin_contract_consistency_test.dart && python3 checks/filesize.py && git diff --check"

- prompt: |
    R162：复核所有 Admin navigation capability consumers 的边界一致性。读取 R161
    报告与 diff，查找 `hasAnyPathPrefix`、`hasDocumentedPathPrefix`、
    `stateForAnyPathPrefix`、`canUseAnyPathPrefix` 的全部生产调用和测试。只在
    test/ 中补充针对至少一个 runtime-only `AdminNavigationCapabilities` 的
    negative lookalike case（例如 inventory 只有 `/api/v1/admin/connections-evil`
    时 supportsConnections 必须为 false；合法 `/connections/{id}` 必须为 true），
    以及 catalog-only lookalike 不得开启 documented fallback 的 case。

    不把 prefix 语义改成 exact endpoint：合法的 descendants、parameterized
    routes、trailing-slash family 和现有 normalization 必须继续通过。不得修改
    screens、API wire、routes、i18n、认证或安全流程；如 R161 已覆盖这些反例，
    只输出审查报告，不重复测试。运行 admin navigation/contract tests、analyze、
    filesize、directory fan-out、diff check。输出
    docs/ui/pages-per-page/r162-capability-boundary-regression.md。
  output: docs/ui/pages-per-page/r162-capability-boundary-regression.md
  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test test/snaplink_admin_api_test.dart test/admin_navigation_test.dart test/admin_contract_consistency_test.dart test/admin_shell_test.dart && python3 checks/filesize.py && python3 checks/directory_fanout.py && git diff --check"

- prompt: |
