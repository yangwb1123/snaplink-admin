  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test test/snaplink_admin_api_test.dart test/admin_navigation_test.dart test/admin_contract_consistency_test.dart test/portal_security_contract_test.dart test/audit_contract_guard_test.dart test/oidc_login_handle_success_census_test.dart && python3 checks/filesize.py && python3 checks/directory_fanout.py && git diff --check"

