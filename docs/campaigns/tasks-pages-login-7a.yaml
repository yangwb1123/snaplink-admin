    4. 验证：flutter analyze 0 errors；flutter test
       test/oidc_account_flow_test.dart test/oidc_challenge_flow_test.dart
       全绿。
    5. 输出 docs/ui/pages-per-page/account-flow.md。不跑 git、不提交。
