- prompt: |
    重构设备验证页面。步骤：
    1. 分析现有代码：lib/screens/device/device_verify_screen.dart、
       device_verify_widgets.dart —— 读完整文件，梳理 RFC 8628 设备码
       确认（请求方/Scope/到期展示、批准/拒绝、终态锁定）的 UI 结构。
    2. 对照可用组件与品牌色，列出改进点。
    3. 实施重构（只改上述文件 + lib/i18n/ EN/ZH key）：
       - 用合适组件替换模板渲染；图标上色；
       - loading/empty/error 三态齐全；设备码语义（上下文缺失禁止
         批准、终态锁定、规范化输入）保持不变；不新增依赖；
         文件 ≤400 行。
    4. 验证：flutter analyze 0 errors；flutter test
       test/device_verify_api_test.dart 及 device 相关 widget 测试
       （如有）全绿。
    5. 输出 docs/ui/pages-per-page/device-verify.md。不跑 git、不提交。
  output: docs/ui/pages-per-page/device-verify.md
  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep -cE '^\\s+error' | grep -q '^0$' && flutter test test/device_verify_api_test.dart 2>&1 | grep -qE 'All tests passed!'"
