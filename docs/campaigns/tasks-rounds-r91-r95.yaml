    card/list；邀请接受、leave、manage 是动作卡/行操作。检查 loading/empty/not-enabled/error
    retry、邀请 token 输入与清除、每行 busy、防重复点击、长 tenant id、窄屏按钮和焦点。
    不为静态组织资料伪造分页。

