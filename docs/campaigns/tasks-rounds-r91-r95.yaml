  validate: "cd {cwd} && flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test test/portal_screens_test.dart test/portal_security_contract_test.dart test/portal_security_web_test.dart test/portal_security_widgets_test.dart test/render_matrix_smoke_test.dart"
